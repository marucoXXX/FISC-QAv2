[project]
name = "fisc-qav2"
version = "0.1.0"
description = "FISC アンケート自動回答マルチエージェントシステム"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.20",
    "openpyxl>=3.1",
    "python-docx>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "reportlab>=4.0",
]
pdf = [
    "PyMuPDF>=1.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: end-to-end pipeline tests",
    "slow: tests that take a long time to run",
]

[tool.ruff]
target-version = "py39"
line-length = 100
