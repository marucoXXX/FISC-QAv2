[project]
name = "fisc-qav2"
version = "0.1.0"
description = "FISC アンケート自動回答マルチエージェントシステム"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: end-to-end pipeline tests",
    "slow: tests that take a long time to run",
]

[tool.ruff]
target-version = "py311"
line-length = 100
