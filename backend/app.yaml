runtime: python311
entrypoint: uvicorn app.main:app --host 0.0.0.0 --port $PORT

# コスト最小構成
automatic_scaling:
  min_instances: 0
  max_instances: 2

env_variables:
  CORS_ORIGINS: "https://izanagi.an.r.appspot.com"
  GCS_BUCKET: "izanagi-resumes"
  # シークレットはSecret Managerから取得
  # Azure AD (設定後に有効化)
  # AZURE_CLIENT_ID: "${AZURE_CLIENT_ID}"
  # AZURE_TENANT_ID: "${AZURE_TENANT_ID}"

handlers:
  # API routes
  - url: /health
    script: auto
  - url: /api/.*
    script: auto

  # Static assets
  - url: /assets
    static_dir: static/assets

  - url: /favicon.svg
    static_files: static/favicon.svg
    upload: static/favicon.svg

  # SPA fallback - serve index.html for all other routes
  - url: /.*
    static_files: static/index.html
    upload: static/index.html
